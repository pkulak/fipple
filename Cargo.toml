[package]
name = "fipple"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A PipeWire meeting recorder that transcribes and summarizes through OpenRouter"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[dev-dependencies]
tiny_http = "0.12.0"
